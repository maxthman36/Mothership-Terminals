<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROSPERO'S DREAM // STATION MODEL</title>
<style>
  :root{ --pink:#ff2d78; --bg:#030304; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:var(--bg);
    font-family:"Courier New",Courier,monospace; color:#ffd7e6; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  header{ position:fixed; top:0; left:0; right:0; padding:12px 18px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none; z-index:5; }
  header .ttl{ font-weight:bold; letter-spacing:.12em; font-size:15px; color:var(--pink);
    text-shadow:0 0 12px rgba(255,45,120,.8); }
  header .sub{ font-size:11px; color:#8a6a78; letter-spacing:.08em; }
  #panel{ position:fixed; top:64px; right:16px; width:300px; max-width:calc(100vw - 32px);
    background:rgba(8,4,8,.88); border:1px solid var(--pink); border-radius:6px;
    padding:14px 16px; z-index:5; display:none;
    box-shadow:0 0 24px rgba(255,45,120,.25); }
  #panel.on{ display:block; }
  #panel .num{ font-size:12px; color:var(--pink); letter-spacing:.2em; }
  #panel h2{ font-size:18px; letter-spacing:.06em; margin:4px 0 8px; color:#fff; }
  #panel p{ font-size:13px; line-height:1.6; color:#e8b8c8; }
  #panel .x{ position:absolute; top:8px; right:10px; cursor:pointer; color:#8a6a78;
    font-size:16px; background:none; border:none; font-family:inherit; }
  #panel .x:hover{ color:var(--pink); }
  #bar{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:5; }
  #bar button{ font-family:inherit; font-size:12px; letter-spacing:.1em; cursor:pointer;
    background:rgba(8,4,8,.85); color:var(--pink); border:1px solid var(--pink);
    padding:9px 16px; border-radius:4px; text-shadow:0 0 8px rgba(255,45,120,.6); }
  #bar button:hover{ background:rgba(255,45,120,.15); }
  #bar button.off{ color:#5a3a48; border-color:#5a3a48; text-shadow:none; }
  #hint{ position:fixed; bottom:18px; left:18px; font-size:11px; color:#6a4a58;
    letter-spacing:.06em; z-index:5; pointer-events:none; }
  @media (max-width:640px){ #hint{ display:none; } #panel{ top:auto; bottom:70px; } }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <div class="ttl">PROSPERO'S DREAM // STATION MODEL</div>
  <div class="sub">RAC NAVCOM &middot; 10 DISTRICTS</div>
</header>
<div id="panel">
  <button class="x" id="closePanel">&times;</button>
  <div class="num" id="pNum"></div>
  <h2 id="pName"></h2>
  <p id="pDesc"></p>
</div>
<div id="bar">
  <button id="btnLabels">LABELS: ON</button>
  <button id="btnRotate">ROTATE: ON</button>
  <button id="btnReset">RESET VIEW</button>
</div>
<div id="hint">drag to orbit &middot; scroll to zoom &middot; click a district</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PINK = 0xff2d78;
const DECK_TOP = 0.75;   // deck plane modules sit on

/* ---------- district data (in-universe; no page refs) ----------
   a = plan angle in degrees (0 = +X, CCW from above), r = plan radius.
   s = [x=radial, y=up, z=tangential] box size. Group rotated so +X is radial. */
const DISTRICTS = [
  { n:"01", name:"DRY DOCK",           desc:"Docking and repairs. 1kcr docking fee + 100cr/day. O2 tax: 10cr/day/person.",
    a:315, r:26, s:[12,6,8], docks:true, seed:11 },
  { n:"02", name:"STELLAR BURN",       desc:"Rumors, drinks, and R&R. Ask for Sem.",
    a:225, r:26, s:[10,6,10], seed:22 },
  { n:"03", name:"CHOP SHOP",          desc:"Cybermod installation and repair.",
    a:45,  r:26, s:[10,6,8], seed:33 },
  { n:"04", name:"THE ICE BOX",        desc:"Slickware installation and re-sleeving.",
    a:270, r:26, s:[6,5,10], seed:44 },
  { n:"05", name:"THE FARM",           desc:"The Dream's food supply, run by the Solarian Church.",
    a:180, r:26, s:[8,6,12], tower:[4,12,4], seed:55 },
  { n:"06", name:"CANYONHEAVY.MARKET", desc:"Information market run by an elite hacking crew.",
    a:18,  r:33, s:[6,5,6], seed:66 },
  { n:"08", name:"TEMPEST CO. HQ",     desc:"Powerful mercenary company. They run station security.",
    a:90,  r:26, s:[8,6,12], tower:[5,24,5], keel:[4,16,4], seed:88 },
  { n:"09", name:"DOPTOWN",            desc:"Debtor's town. For those who can't pay the O2 tax.",
    a:-15, r:8,  y:-16, s:[7,6,7], col:true, seed:99 },
  { n:"10", name:"THE CHOKE",          desc:"Abandoned, quarantined wasteland.",
    a:-32, r:7,  y:-27, s:[8,6,8], col:true, seed:101 },
];
const COURT = { n:"07", name:"THE COURT",
  desc:"Disputes settled by arena combat. Where the station's power brokers gather." };

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030304);
scene.fog = new THREE.FogExp2(0x030304, 0.0028);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1200);
const CAM_HOME = new THREE.Vector3(58, 40, 74);
camera.position.copy(CAM_HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 28;
controls.maxDistance = 260;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0x887788, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(50, 80, 40); scene.add(key);
const fill = new THREE.DirectionalLight(0x6688cc, 0.5);
fill.position.set(-40, -30, 60); scene.add(fill);
const pl1 = new THREE.PointLight(PINK, 2600, 260, 1.8);
pl1.position.set(-35, 25, -25); scene.add(pl1);
const pl2 = new THREE.PointLight(PINK, 2000, 260, 1.8);
pl2.position.set(35, -18, 30); scene.add(pl2);

/* ---------- starfield ---------- */
{
  const N = 1600, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const R = 380 + Math.random() * 320, t = Math.random() * Math.PI * 2,
          p = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = R * Math.sin(p) * Math.cos(t);
    pos[i*3+1] = R * Math.cos(p);
    pos[i*3+2] = R * Math.sin(p) * Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x8899bb, size:1.1, sizeAttenuation:false })));
}

/* ---------- materials / helpers ---------- */
const station = new THREE.Group(); scene.add(station);
const hullMat  = new THREE.MeshStandardMaterial({ color:0x14141b, roughness:0.5, metalness:0.7 });
const darkMat  = new THREE.MeshStandardMaterial({ color:0x0a0a0f, roughness:0.7, metalness:0.5 });
const edgeMat  = new THREE.LineBasicMaterial({ color:PINK, transparent:true, opacity:0.8 });
const trackMat = new THREE.MeshBasicMaterial({ color:PINK });
const pickables = [];
const labels = [];

function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function edged(geo, mat) {
  const grp = new THREE.Group();
  const mesh = new THREE.Mesh(geo, mat);
  grp.add(mesh);
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
  return grp;
}
function boxAt(w, h, d, x, y, z, mat) {
  const g = edged(new THREE.BoxGeometry(w, h, d), mat || hullMat);
  g.position.set(x, y, z); station.add(g); return g;
}
function beamBetween(x1, z1, x2, z2, y, h) {
  const dx = x2 - x1, dz = z2 - z1;
  const b = boxAt(Math.hypot(dx, dz), h || 1.1, h || 1.1, (x1+x2)/2, y, (z1+z2)/2, darkMat);
  b.rotation.y = Math.atan2(-dz, dx);
  return b;
}

/* ---------- central hub disc (The Court platform) ---------- */
const courtGroup = new THREE.Group();
courtGroup.userData.district = COURT;
{
  const disc = edged(new THREE.CylinderGeometry(11, 11, 3, 24), hullMat);
  courtGroup.add(disc);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(11, 0.45, 8, 48), trackMat);
  rim.rotation.x = Math.PI / 2; rim.position.y = 1.5; courtGroup.add(rim);
  const hubRing = new THREE.Mesh(new THREE.TorusGeometry(7, 0.22, 8, 40), trackMat);
  hubRing.rotation.x = Math.PI / 2; hubRing.position.y = 1.55; courtGroup.add(hubRing);
  const hall = edged(new THREE.BoxGeometry(8.5, 4.5, 8.5), hullMat);
  hall.position.y = 3.75; courtGroup.add(hall);
  const tier = edged(new THREE.BoxGeometry(5.5, 3, 5.5), darkMat);
  tier.position.y = 7.5; courtGroup.add(tier);
  courtGroup.traverse(o => { if (o.isMesh) pickables.push(o); });
  station.add(courtGroup);
  COURT._group = courtGroup;
}

/* ---------- tapered column below + fins (houses 09/10) ---------- */
{
  const col = edged(new THREE.CylinderGeometry(4.5, 2.2, 34, 8), darkMat);
  col.position.y = -18.5; station.add(col);
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + Math.PI / 8;
    const fin = boxAt(1.0, 30, 2.4, 3.6 * Math.cos(a), -18, -3.6 * Math.sin(a), darkMat);
    fin.rotation.y = a;
  }
}

/* ---------- upper mast ---------- */
boxAt(3, 22, 3, 0, 13, 0, darkMat);   // spans y 2..24
boxAt(8, 1.2, 1.2, 0, 18, 0, darkMat);
boxAt(1.2, 1.2, 6, 0, 21.5, 0, darkMat);

/* ---------- ring: 3/4 annular sector, ribbed, plus a rebuilt extension ----------
   The ring was built as a 3/4 circle of ribbed ring sections (gap between
   nodes 1 and 6), then rebuilt with a smooth curved extension out to nodes 3
   and 6. The ring stays completely broken between nodes 6 and 1. */
const D2R = THREE.MathUtils.degToRad;
function arcTorus(radius, tube, a0, a1, y, mat, tubSeg, radSeg) {
  // torus arc spanning plan-angles [a0, a1] (0 = +X, CCW from above)
  const g = new THREE.TorusGeometry(radius, tube, radSeg || 8, tubSeg || 90, D2R(a1 - a0));
  g.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(g, mat);
  m.rotation.y = D2R(a1);
  m.position.y = y;
  station.add(m);
  return m;
}
{
  // main ring: exactly a 3/4 circle (270deg) of ribbed cylindrical tube.
  // Gap between nodes 1 and 6; the ring is completely broken there.
  const ringTube = arcTorus(26, 2.5, 45, 315, 0, hullMat, 100, 14);
  for (let k = 0; k <= 23; k++) {
    const t = (k / 23) * D2R(270);
    const rib = new THREE.Mesh(new THREE.TorusGeometry(2.62, 0.18, 6, 18), trackMat);
    rib.position.set(26 * Math.cos(t), 0, 26 * Math.sin(t));
    rib.rotation.y = -t;
    ringTube.add(rib);
  }
  // rebuilt extension: smooth tube across the gap to nodes 3 & 6.
  // It starts clear of node 1's ring end, so the break stays complete.
  arcTorus(30, 1.6, -5, 50, 0.9, hullMat, 60, 10);
  // stub from the extension down to node 3's module
  beamBetween(30 * Math.cos(D2R(45)), -30 * Math.sin(D2R(45)),
              21 * Math.cos(D2R(45)), -21 * Math.sin(D2R(45)), 0.8);
}

/* ---------- 5 spokes: between 1&4, at 2, near 5, on 8, on 3 ---------- */
[292.5, 225, 172, 90, 45].forEach(deg => {
  const a = D2R(deg), inner = 11, len = 16;
  const sp = boxAt(len, 1.3, 1.3, (inner + len/2) * Math.cos(a), 0, -(inner + len/2) * Math.sin(a), darkMat);
  sp.rotation.y = a;
});

/* ---------- district label sprites ---------- */
function makeLabel(num, name) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.strokeStyle = '#ff2d78'; x.lineWidth = 6;
  x.beginPath(); x.arc(62, 64, 42, 0, Math.PI * 2); x.stroke();
  x.fillStyle = '#ff2d78'; x.textBaseline = 'middle';
  x.font = 'bold 50px "Courier New", monospace'; x.textAlign = 'center';
  x.fillText(num, 62, 66);
  x.font = 'bold 32px "Courier New", monospace'; x.textAlign = 'left';
  const label = (num + ' ' + name).length > 18 ? name : (num + ' ' + name);
  x.fillText(label, 118, 66);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  sp.scale.set(17, 4.25, 1);
  return sp;
}

/* ---------- district modules on the band ---------- */
DISTRICTS.forEach(d => {
  const rad = d.a * Math.PI / 180;
  const px = d.r * Math.cos(rad), pz = -d.r * Math.sin(rad);
  const rnd = mulberry32(d.seed);
  const grp = new THREE.Group();
  grp.userData.district = d;
  grp.rotation.y = rad;   // local +X points radially outward

  const deckY = d.col ? d.y : DECK_TOP + d.s[1] / 2;

  const main = edged(new THREE.BoxGeometry(d.s[0], d.s[1], d.s[2]), hullMat);
  grp.add(main); pickables.push(main.children[0]);

  // roof greebles
  const n = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const w = 1 + rnd() * d.s[0] * 0.35, h = 1 + rnd() * 3, dep = 1 + rnd() * d.s[2] * 0.35;
    const g = edged(new THREE.BoxGeometry(w, h, dep), darkMat);
    if (rnd() < 0.35) {
      const side = rnd() < 0.5 ? 1 : -1;
      g.position.set(side * (d.s[0]/2 + w/2 - 0.5), (rnd()-0.5) * d.s[1] * 0.5, (rnd()-0.5) * d.s[2] * 0.8);
    } else {
      g.position.set((rnd()-0.5) * d.s[0] * 0.9, d.s[1]/2 + h/2 - 0.5, (rnd()-0.5) * d.s[2] * 0.9);
    }
    grp.add(g); pickables.push(g.children[0]);
  }

  // docking arms at the outer end (Dry Dock)
  if (d.docks) {
    [-1, 1].forEach(sgn => {
      const da = edged(new THREE.BoxGeometry(3, 2, 1.5), darkMat);
      da.position.set(d.s[0]/2 + 1.2, -d.s[1]/2 + 1, sgn * d.s[2] / 4);
      grp.add(da); pickables.push(da.children[0]);
    });
  }

  // tower rising from the module (Farm, Tempest HQ)
  let topY = d.s[1] / 2;
  if (d.tower) {
    const tw = edged(new THREE.BoxGeometry(d.tower[0], d.tower[1], d.tower[2]), hullMat);
    tw.position.set(0, d.s[1]/2 + d.tower[1]/2 - 0.5, 0);
    grp.add(tw); pickables.push(tw.children[0]);
    const cap = edged(new THREE.BoxGeometry(d.tower[0]*0.6, 2, d.tower[2]*0.6), darkMat);
    cap.position.set(0, d.s[1]/2 + d.tower[1] - 0.5 + 1, 0);
    grp.add(cap); pickables.push(cap.children[0]);
    topY = d.s[1]/2 + d.tower[1] + 1.5;
  }

  // open docking boxes (Dry Dock): hollow cradles, mouths facing outward
  if (d.docks) {
    const bay = (w, h, dpt, lx, lz) => {
      const g = new THREE.Group();
      const t = 0.5;
      const panel = (bw, bh, bd, x, y, z) => {
        const p = edged(new THREE.BoxGeometry(bw, bh, bd), darkMat);
        p.position.set(x, y, z); g.add(p); pickables.push(p.children[0]);
      };
      panel(t, h, dpt, -w/2, 0, 0);   // back wall
      panel(w, t, dpt, 0, h/2, 0);    // roof
      panel(w, t, dpt, 0, -h/2, 0);   // floor
      panel(w, h, t, 0, 0, dpt/2);    // side wall
      panel(w, h, t, 0, 0, -dpt/2);   // side wall
      g.position.set(lx, -d.s[1]/2 + h/2 + 0.6, lz);
      grp.add(g);
    };
    bay(7, 5.5, 6, d.s[0]/2 + 3.5, -4);
    bay(6, 4.5, 5, d.s[0]/2 + 3, 3.5);
    bay(5, 4, 5, d.s[0]/2 + 9, -1);
  }

  // spoke for the below-deck districts (09/10 ride the column)
  if (d.col) {
    const reach = d.r - 3 + d.s[0] / 2 + 1;
    const arm = boxAt(reach, 1.1, 1.1, 0, 0, 0, darkMat);
    const mid = 3 + reach / 2;
    arm.position.set(mid * Math.cos(rad), d.y, -mid * Math.sin(rad));
    arm.rotation.y = rad;
  }
  // keel below the deck (Tempest HQ extends below the ring plane)
  if (d.keel) {
    const kl = edged(new THREE.BoxGeometry(d.keel[0], d.keel[1], d.keel[2]), hullMat);
    kl.position.set(0, -(d.s[1]/2 + d.keel[1]/2 - 0.5), 0);
    grp.add(kl); pickables.push(kl.children[0]);
  }

  const label = makeLabel(d.n, d.name);
  label.position.set(px, deckY + topY + 5, pz);
  station.add(label); labels.push(label);

  grp.position.set(px, deckY, pz);
  station.add(grp);
  d._group = grp;
});

/* ---------- court label ---------- */
{
  const label = makeLabel(COURT.n, COURT.name);
  label.position.set(0, 14, 0);
  station.add(label); labels.push(label);
}

/* ---------- beacons ---------- */
const beacons = [];
[[0, 25.5, 0], [0, 3.4, -26], [0, 3.4, 26], [0, -36.5, 0]].forEach(p => {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12),
                           new THREE.MeshBasicMaterial({ color:PINK }));
  b.position.set(p[0], p[1], p[2]); station.add(b); beacons.push(b);
});

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const panel = document.getElementById('panel');
let selected = null;
let downAt = null;

function setHighlight(d, on) {
  d._group.traverse(o => {
    if (o.isMesh && o.material && o.material.emissive !== undefined) {
      if (on) { o.userData._mat = o.material; o.material = o.material.clone();
                o.material.emissive = new THREE.Color(PINK); o.material.emissiveIntensity = 0.35; }
      else if (o.userData._mat) { o.material = o.userData._mat; delete o.userData._mat; }
    }
  });
}
function select(d) {
  if (selected) setHighlight(selected, false);
  selected = d;
  if (!d) { panel.classList.remove('on'); return; }
  setHighlight(d, true);
  document.getElementById('pNum').textContent = 'DISTRICT ' + d.n;
  document.getElementById('pName').textContent = d.name;
  document.getElementById('pDesc').textContent = d.desc;
  panel.classList.add('on');
}
document.getElementById('closePanel').onclick = () => select(null);
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const dx = e.clientX - downAt[0], dy = e.clientY - downAt[1];
  downAt = null;
  if (dx * dx + dy * dy > 25) return; // it was a drag
  ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  let target = null;
  if (hit) { let o = hit.object; while (o && !o.userData.district) o = o.parent; target = o ? o.userData.district : null; }
  select(target);
});

/* ---------- ui buttons ---------- */
const btnL = document.getElementById('btnLabels');
const btnR = document.getElementById('btnRotate');
btnL.onclick = () => {
  const on = !labels[0].visible;
  labels.forEach(l => l.visible = on);
  btnL.textContent = 'LABELS: ' + (on ? 'ON' : 'OFF');
  btnL.classList.toggle('off', !on);
};
btnR.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  btnR.textContent = 'ROTATE: ' + (controls.autoRotate ? 'ON' : 'OFF');
  btnR.classList.toggle('off', !controls.autoRotate);
};
document.getElementById('btnReset').onclick = () => {
  camera.position.copy(CAM_HOME);
  controls.target.set(0, 0, 0);
  select(null);
};

/* ---------- loop / resize ---------- */
function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  beacons.forEach((b, i) => {
    const s = 1 + 0.35 * Math.sin(t * 3 + i * 1.7);
    b.scale.set(s, s, s);
  });
  station.rotation.y += 0.0004;
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
