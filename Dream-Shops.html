}

/* ================= SCREENSAVER ================= */
let idleT=null, bx=100, by=80, vx=2.2, vy=1.7, saverOn=false;
function idleReset(){ if(saverOn) return; clearTimeout(idleT); idleT=setTimeout(showSaver,60000); }
function showSaver(){ saverOn=true; document.getElementById("saver").classList.add("on"); beep(660,.12,"square",.03); saverLoop(); }
function hideSaver(){ saverOn=false; document.getElementById("saver").classList.remove("on"); sClick(); idleReset(); }
function saverLoop(){
  if(!saverOn) return;
  const el=document.getElementById("buy"), W=innerWidth-120, H=innerHeight-80;
  bx+=vx; by+=vy; if(bx<0||bx>W){vx=-vx; beep(520,.05,"square",.03);} if(by<0||by>H){vy=-vy; beep(660,.05,"square",.03);}
  el.style.left=bx+"px"; el.style.top=by+"px";
  requestAnimationFrame(saverLoop);
}
["mousemove","keydown","touchstart","click"].forEach(ev=>document.addEventListener(ev,idleReset,{passive:true}));
